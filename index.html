<head>

    <title>Planning Urban 7D</title>
    <script>
    (function() {
        var weeks = [{"week": 9, "start": "2026-02-23", "end": "2026-03-01"}, {"week": 10, "start": "2026-03-02", "end": "2026-03-08"}, {"week": 11, "start": "2026-03-09", "end": "2026-03-15"}, {"week": 12, "start": "2026-03-16", "end": "2026-03-22"}, {"week": 13, "start": "2026-03-23", "end": "2026-03-29"}, {"week": 14, "start": "2026-03-30", "end": "2026-04-05"}];
        var today = new Date();
        var yyyy = today.getFullYear();
        var mm = String(today.getMonth()+1).padStart(2,"0");
        var dd = String(today.getDate()).padStart(2,"0");
        var todayStr = yyyy + "-" + mm + "-" + dd;
        var target = null;
        for (var i = 0; i < weeks.length; i++) {
            if (todayStr >= weeks[i].start && todayStr <= weeks[i].end) {
                target = weeks[i].week; break;
            }
        }
        if (!target) target = weeks[weeks.length - 1].week;
        window.location.replace("S" + target + ".html");
    })();
    </script>
