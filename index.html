<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Planning U7D">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9917;</text></svg>">
    <meta name="theme-color" content="#FF6600">
    <title>Planning Urban 7D</title>
    <style>
        body { background: #1A1A1A; margin: 0; }
    </style>
    <script>
    (function() {
        var weeks = [{"week": 9, "start": "2026-02-23", "end": "2026-03-01"}, {"week": 10, "start": "2026-03-02", "end": "2026-03-08"}, {"week": 11, "start": "2026-03-09", "end": "2026-03-15"}, {"week": 12, "start": "2026-03-16", "end": "2026-03-22"}, {"week": 13, "start": "2026-03-23", "end": "2026-03-29"}, {"week": 14, "start": "2026-03-30", "end": "2026-04-05"}];
        var today = new Date();
        var yyyy = today.getFullYear();
        var mm = String(today.getMonth()+1).padStart(2,"0");
        var dd = String(today.getDate()).padStart(2,"0");
        var todayStr = yyyy + "-" + mm + "-" + dd;
        var target = null;
        for (var i = 0; i < weeks.length; i++) {
            if (todayStr >= weeks[i].start && todayStr <= weeks[i].end) {
                target = weeks[i].week; break;
            }
        }
        if (!target) target = weeks[weeks.length - 1].week;
        fetch("S" + target + ".html")
            .then(function(r) { return r.text(); })
            .then(function(html) {
                document.open();
                document.write(html);
                document.close();
            })
            .catch(function() {
                window.location.replace("S" + target + ".html");
            });
    })();
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=S14.html"></noscript>
</head>
