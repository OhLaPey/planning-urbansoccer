            pointer-events: none; z-index: 0;

        /* ── Header ── */
        .back-link {
            position: fixed; left: 16px; top: 16px; z-index: 90;
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 14px; border-radius: 40px; text-decoration: none;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            color: #bbb; font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; transition: all 0.2s;
        }
        .back-link:hover { background: rgba(255,102,0,0.12); border-color: rgba(255,102,0,0.4); color: #FF6600; }
        @media (max-width: 600px) { .back-link { left: 12px; top: 12px; padding: 7px 11px; font-size: 11px; } }
        .header { text-align: center; padding: 22px 10px 10px; }
        .header .tv-icon { font-size: 24px; }
        h1 {
            color: #fff; font-size: 30px; font-weight: 900; margin: 4px 0 2px;
            text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(255,102,0,0.3);
        }
        .subtitle {
            color: #FF6600; font-size: 12px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 4px;
        }
        .clock {
            margin-top: 12px; font-size: 15px; color: #bbb; font-weight: 600;
            text-transform: capitalize;
        }
        .clock .time { color: #FF6600; font-weight: 800; }

        /* ── Bandeau « À ne pas manquer » (événements majeurs + padel) ── */
        .highlights {
            margin: 16px 0 4px; padding: 13px 16px; border-radius: 8px;
            background: linear-gradient(135deg, rgba(255,102,0,0.14), rgba(255,102,0,0.03));
            border: 1px solid rgba(255,102,0,0.35);
        }
        .hl-title {
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1.5px; color: #FF6600; margin-bottom: 10px;
        }
        .hl-list { display: flex; flex-direction: column; gap: 7px; }
        .hl-item { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .hl-cat {
            font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4px;
            padding: 2px 8px; border-radius: 4px; color: #1A1A1A; flex-shrink: 0;
            min-width: 86px; text-align: center;
        }
        .hl-when { font-size: 12px; font-weight: 800; color: #FFD54A; flex-shrink: 0; min-width: 96px; }
        .hl-when-live { color: #FF6600; }
        .hl-aff { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
        .hl-meta { display: flex; align-items: center; gap: 6px; margin-left: auto;
                    flex-shrink: 0; font-size: 11px; color: #aaa; white-space: nowrap; }
        @media (max-width: 620px) {
            .hl-item { flex-wrap: wrap; gap: 5px 8px; }
            .hl-meta { margin-left: 0; }
        }

        /* ── Bandeau « En ce moment / À suivre » ── */
        .now-next { display: flex; gap: 10px; margin: 16px 0 4px; }
        .nn-block { flex: 1; min-width: 0; padding: 12px 15px; border-radius: 8px;
                     background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); }
        .nn-live { border-color: rgba(255,102,0,0.35); background: rgba(255,102,0,0.06); }
        .nn-label { font-size: 10px; font-weight: 800; text-transform: uppercase;
                     letter-spacing: 1.5px; color: #888; margin-bottom: 9px;
                     display: flex; align-items: center; gap: 7px; }
        .nn-live .nn-label { color: #FF6600; }
        .nn-dot { width: 8px; height: 8px; border-radius: 50%; background: #FF6600;
                   animation: nowPulse 1.4s ease-in-out infinite; }
        .nn-item { display: flex; align-items: center; gap: 9px; padding: 4px 0; min-width: 0; }
        .nn-num { background: rgba(255,255,255,0.95); color: #111; font-weight: 900;
                   font-size: 12px; min-width: 22px; text-align: center;
                   padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
        .nn-num.clair { background: #FF6600; color: #1A1A1A; }
        .nn-time { font-size: 15px; font-weight: 800; color: #FF6600; flex-shrink: 0; }
        .nn-aff { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
        .nn-meta { font-size: 11px; color: #999; font-weight: 600; margin-left: auto;
                    flex-shrink: 0; white-space: nowrap; }
        .nn-empty { font-size: 13px; color: #666; font-weight: 600; }

        /* ── Légende chaînes ── */
        .legend {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            margin: 14px 0 8px; padding: 12px; border-radius: 8px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
        }
        .legend-title {
            width: 100%; text-align: center; font-size: 10px; font-weight: 700;
            color: #777; text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 6px;
        }
        .chan-badge {
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 11px; font-weight: 800; padding: 4px 11px 4px 5px; border-radius: 5px;
            color: #fff; text-transform: uppercase; letter-spacing: 0.3px;
            border: 1px solid rgba(255,255,255,0.14); white-space: nowrap;
        }
        .chan-num {
            background: rgba(255,255,255,0.95); color: #111; font-weight: 900;
            font-size: 12px; min-width: 22px; text-align: center;
            padding: 2px 5px; border-radius: 4px; letter-spacing: 0;
        }
        .chan-badge.clair .chan-num { background: #FF6600; color: #1A1A1A; }
        .chan-badge.clair::after {
            content: 'CLAIR'; font-size: 8px; opacity: 0.85;
            background: rgba(255,255,255,0.2); padding: 1px 4px; border-radius: 3px;
        }

        /* ── Jour ── */
        .day-block { margin-top: 20px; }
        .day-head {
            display: flex; align-items: baseline; gap: 10px;
            padding: 8px 4px; border-bottom: 2px solid rgba(255,102,0,0.35);
            margin-bottom: 10px;
        }
        .day-head .day-name {
            font-size: 18px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px; color: #fff;
        }
        .day-head .day-date { font-size: 12px; color: #888; font-weight: 600; }
        .day-head.today .day-name { color: #FF6600; }
        .day-head .today-tag {

            background: #FF6600; color: #1A1A1A; padding: 3px 10px;
            border-radius: 5px; text-transform: uppercase; letter-spacing: 1px;

        .timeline {
            position: relative; overflow-x: auto; margin-bottom: 10px;
            -webkit-overflow-scrolling: touch;

        .tl-gridline.half { border-left: 1px dashed rgba(255,255,255,0.07); }
        .tl-bar {

            box-shadow: inset 0 0 10px rgba(255,255,255,0.04);

        .tl-prog-sub { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.72);

        .tl-prog-live { color: #FFD54A; }
        .tl-bar-live { position: absolute; top: 4px; right: 6px; font-size: 8px; font-weight: 900;

                        text-transform: uppercase; letter-spacing: 0.5px; }
        /* Curseur d'heure en direct */
        .tl-now { position: absolute; top: 0; bottom: 0; width: 2px; z-index: 3; pointer-events: none;

        /* ── Sélecteur de jour (identique au planning staff) ── */
        .day-tabs {
            display: flex; gap: 4px; margin: 16px 0 6px; overflow-x: auto;
            padding-bottom: 4px; -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .day-tabs::-webkit-scrollbar { display: none; }
        .day-tab {
            padding: 9px 12px; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
            color: #666; font-size: 13px; font-weight: 700; cursor: pointer;
            white-space: nowrap; transition: all 0.2s; flex: 1; min-width: 0;
            text-align: center; text-transform: uppercase; letter-spacing: 0.5px;

        .day-tab.active {
            background: rgba(255,102,0,0.15); border-color: rgba(255,102,0,0.3); color: #FF6600;

        /* ── Vide ── */
        .empty-state { text-align: center; padding: 46px 20px; color: #666; }

        .foot {

            border-top: 1px solid rgba(255,255,255,0.06);

            .tl-name { width: 104px; padding-right: 8px; }
            .tl-affiche { font-size: 12px; }
            .tl-track { height: 38px; }
            .tl-bar-chan { font-size: 11px; }
        }

            '</div>';

        // ── Une ligne par chaîne pertinente ce jour ──
        var byChan = {}, chanOrder = [];
        evts.forEach(function(ev) {
            if (!byChan[ev.chaine]) { byChan[ev.chaine] = []; chanOrder.push(ev.chaine); }
            byChan[ev.chaine].push(ev);
        });
        // Ordonner les chaînes par numéro de chaîne croissant
        // (sans numéro → rejeté en fin de liste, puis ordre alphabétique)
        chanOrder.sort(function(a, b) {
            var na = parseInt(chanNum(a), 10), nb = parseInt(chanNum(b), 10);
            var va = isNaN(na) ? Infinity : na, vb = isNaN(nb) ? Infinity : nb;
            if (va !== vb) return va - vb;
            return a.localeCompare(b);
        });

        // Le jour même : masquer les chaînes sans diffusion dans l'heure qui vient.
        if (isToday) {
            var winStart = now.getTime();
            var winEnd = winStart + 60*60000;
            chanOrder = chanOrder.filter(function(chaine) {
                return byChan[chaine].some(function(ev) {
                    var s = eventStart(ev).getTime();
                    var e = s + eventDuration(ev)*60000;
                    return s < winEnd && e > winStart;  // chevauche [maintenant, +1h]
                });
            });
            if (!chanOrder.length) {
                schedule.innerHTML = headHtml + '<div class="empty-state"><div class="big">📺</div>' +
                    '<p>Aucune diffusion dans l\'heure qui vient.</p></div>';
                return;
            }
        }

        var rowsHtml = "";
        chanOrder.forEach(function(chaine) {
            var num = chanNum(chaine);
            var clair = chanClair(chaine);
            var nameCell = '<div class="tl-name tl-chan">' +
                (num ? '<span class="tl-chan-num' + (clair ? " clair" : "") + '">' + esc(num) + '</span>' : '') +
                '<span class="tl-chan-name">' + esc(chaine) + '</span>' +
                '</div>';

            var track = '<div class="tl-track">' + gridHtml + nowHtml;
            byChan[chaine].forEach(function(ev) {
                var s = eventStart(ev);
                var end = new Date(s.getTime() + eventDuration(ev)*60000);
                var sh = s.getHours() + s.getMinutes()/60;
                var eh = sh + eventDuration(ev)/60;
                var left = ((sh - minH) / range) * 100;
                var width = ((eh - sh) / range) * 100;
                if (left < 0) { width += left; left = 0; }      // coupe la partie avant 9h
                if (left + width > 100) width = 100 - left;       // coupe après la fermeture
                if (width <= 0) return;                            // entièrement hors ouverture

                var state = (now >= s && now < end) ? "live" : (now >= end ? "done" : "soon");
                var cat = catInfo(ev.categorie);
                var barCls = "tl-bar" + (state === "live" ? " live" : "") + (state === "done" ? " done" : "");
                var barStyle = 'left:' + left + '%;width:' + width + '%;' +
                    'background:' + hexToRgba(cat.couleur, 0.26) + ';border-color:' + cat.couleur + ';';
                var barTitle = esc((ev.heure || "") + " · " + (ev.affiche || "") +
                    " — " + (ev.competition || "") + " · " + chaine);
                var liveHtml = (state === "live") ? '<span class="tl-bar-live">Direct</span>' : '';

                track += '<div class="' + barCls + '" style="' + barStyle + '" title="' + barTitle + '">' +
                    liveHtml +
                    '<div class="tl-prog-title">' + esc(ev.affiche || ev.competition || "") + '</div>' +
                    '<div class="tl-prog-sub' + (state === "live" ? " tl-prog-live" : "") + '">' +
                        esc((ev.heure || "") + " · " + (ev.competition || cat.label)) + '</div>' +
                '</div>';
            });
            track += '</div>';

            rowsHtml += '<div class="tl-row">' + nameCell + track + '</div>';
        });

        var inner = '<div class="tl-inner" style="min-width:' + innerMin + 'px">' +
            markersRow + rowsHtml + '</div>';
        schedule.innerHTML = headHtml + '<div class="timeline" id="timeline">' + inner + '</div>';

        // Auto-scroll pour centrer l'heure courante
        if (showNow) {
            var tl = document.getElementById("timeline");
            var innerEl = tl.querySelector(".tl-inner");
            var scrollPct = (currentH - minH) / range;
            var scrollableWidth = innerEl.scrollWidth - nameW;
            var target = nameW + scrollPct * scrollableWidth - tl.clientWidth / 2;
            tl.scrollLeft = Math.max(0, target);
        }
    }

    function rebuild() {
        renderClock();
        renderHighlights();
        var evts = diffusableEvents();
        STATE.dates = uniqueDates(evts);

        if (!STATE.dates.length) {
            document.getElementById("day-tabs").innerHTML = "";
            document.getElementById("schedule").innerHTML =
                '<div class="empty-state"><div class="big">📺</div>' +
                '<p>Aucune diffusion programmée pour le moment.</p></div>';
            return;
        }

        // Conserve le jour choisi s'il existe encore, sinon aujourd'hui, sinon le 1er.
        var todayStr = ymd(new Date());
        if (STATE.dates.indexOf(STATE.current) === -1) {
            STATE.current = (STATE.dates.indexOf(todayStr) !== -1) ? todayStr : STATE.dates[0];
        }
        renderDayTabs();
        renderDay();
    }

    rebuild();
    setInterval(rebuild, 60000);           // rafraîchit l'état EN DIRECT + jours chaque minute
    setInterval(function() {               // recharge la page 1×/h (nouveau programme éventuel)
        location.reload();
    }, 3600000);
    </script>
</body>
</html>
