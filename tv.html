            padding: 15px;

        }
        body::before {

            background: url('bg-team.jpg') center center / cover no-repeat;
            opacity: 0.18;
        }
        .container {
            position: relative; z-index: 1; max-width: 1100px; margin: 0 auto;

        .subtitle {

        }
        .clock {

            text-transform: capitalize;
        }
        .clock .time { color: #FF6600; font-weight: 800; }

        .nn-live { border-color: rgba(255,102,0,0.35); background: rgba(255,102,0,0.06); }
        .nn-label { font-size: 10px; font-weight: 800; text-transform: uppercase;

                     display: flex; align-items: center; gap: 7px; }
        .nn-live .nn-label { color: #FF6600; }
        .nn-dot { width: 8px; height: 8px; border-radius: 50%; background: #FF6600;

        .nn-item { display: flex; align-items: center; gap: 9px; padding: 4px 0; min-width: 0; }
        .nn-num { background: rgba(255,255,255,0.95); color: #111; font-weight: 900;

                   padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
        .nn-num.clair { background: #FF6600; color: #1A1A1A; }
        .nn-time { font-size: 15px; font-weight: 800; color: #FF6600; flex-shrink: 0; }
        .nn-aff { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
        .nn-meta { font-size: 11px; color: #999; font-weight: 600; margin-left: auto;
                    flex-shrink: 0; white-space: nowrap; }
        .nn-empty { font-size: 13px; color: #666; font-weight: 600; }

        /* ── Légende chaînes ── */
        .legend {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            margin: 14px 0 8px; padding: 12px; border-radius: 8px;
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
        }
        .legend-title {
            width: 100%; text-align: center; font-size: 10px; font-weight: 700;
            color: #777; text-transform: uppercase; letter-spacing: 1.5px;
            margin-bottom: 6px;
        }
        .chan-badge {
            display: inline-flex; align-items: center; gap: 7px;
            font-size: 11px; font-weight: 800; padding: 4px 11px 4px 5px; border-radius: 5px;
            color: #fff; text-transform: uppercase; letter-spacing: 0.3px;
            border: 1px solid rgba(255,255,255,0.14); white-space: nowrap;
        }
        .chan-num {
            background: rgba(255,255,255,0.95); color: #111; font-weight: 900;
            font-size: 12px; min-width: 22px; text-align: center;
            padding: 2px 5px; border-radius: 4px; letter-spacing: 0;
        }
        .chan-badge.clair .chan-num { background: #FF6600; color: #1A1A1A; }

            content: 'CLAIR'; font-size: 8px; opacity: 0.85;
            background: rgba(255,255,255,0.2); padding: 1px 4px; border-radius: 3px;
        }

        /* ── Jour ── */

            padding: 8px 4px; border-bottom: 2px solid rgba(255,102,0,0.35);
            margin-bottom: 10px;
        }
        .day-head .day-name {
            font-size: 18px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px; color: #fff;
        }
        .day-head .day-date { font-size: 12px; color: #888; font-weight: 600; }
        .day-head.today .day-name { color: #FF6600; }

            background: #FF6600; color: #1A1A1A; padding: 3px 10px;

            scrollbar-width: none;

    var JS_DAYS = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];

    var JS_MONTHS = ["janvier","février","mars","avril","mai","juin","juillet",
                     "août","septembre","octobre","novembre","décembre"];
    var EVENT_DURATION_MIN = 130; // durée supposée d'un match/événement

    function pad(n) { return (n < 10 ? "0" : "") + n; }
    function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }

    function eventStart(ev) {
        var p = ev.date.split("-");
        var t = (ev.heure || "00:00").split(":");
        return new Date(+p[0], +p[1]-1, +p[2], +t[0], +(t[1]||0));
    }
    function eventDuration(ev) {
        return (ev.duree_min && ev.duree_min > 0) ? ev.duree_min : EVENT_DURATION_MIN;
    }

    function isAvailable(chaine) {
        var dispo = (DATA.abonnement.disponibles || []);
        return dispo.indexOf(chaine) !== -1;
    }

    function chanColor(chaine) {
        var m = DATA.chaines_meta[chaine];
        return m ? m.couleur : "#455a64";
    }
    function chanClair(chaine) {
        var m = DATA.chaines_meta[chaine];
        return m ? !!m.clair : false;
    }
    function chanNum(chaine) {
        var m = DATA.chaines_meta[chaine];
        return (m && m.numero) ? m.numero : "";
    }
    function chanBadge(chaine) {
        var num = chanNum(chaine);
        var numHtml = num ? '<span class="chan-num">' + num + '</span>' : '';
        return '<span class="chan-badge' + (chanClair(chaine) ? ' clair' : '') +
               '" style="background:' + chanColor(chaine) + '">' +
               numHtml + '<span>' + chaine + '</span></span>';
    }
    function catInfo(cat) {
        return DATA.categories[cat] || { label: cat || "Sport", couleur: "#78909C" };
    }

    function renderClock() {
        var now = new Date();
        var el = document.getElementById("clock");
        el.innerHTML = JS_DAYS[now.getDay()] + " " + now.getDate() + " " +
            JS_MONTHS[now.getMonth()] + " · <span class=\"time\">" +
            pad(now.getHours()) + ":" + pad(now.getMinutes()) + "</span>";
    }

    function renderLegend() {
        var wrap = document.getElementById("legend");
        var html = '<div class="legend-title">Chaînes disponibles au centre · numéro à gauche</div>';

            html += chanBadge(ch);

                t = '<span class="nn-time">' + esc(lbl) + '</span>';
            }
            return '<div class="nn-item">' + t + nnChip(ev.chaine) +
                '<span class="nn-aff">' + esc(ev.affiche || ev.competition || "") + '</span>' +
                '<span class="nn-meta">' + esc(ev.chaine) + '</span></div>';
        }

        var liveInner = live.length
            ? live.map(function(ev) { return itemHtml(ev, false); }).join("")
            : '<div class="nn-empty">Aucune diffusion en cours</div>';
        var nextInner = next
            ? itemHtml(next, true)
            : '<div class="nn-empty">Aucune diffusion à venir</div>';

        el.innerHTML =
            '<div class="nn-block nn-live"><div class="nn-label"><span class="nn-dot"></span>En ce moment</div>' + liveInner + '</div>' +
            '<div class="nn-block nn-next"><div class="nn-label">À suivre</div>' + nextInner + '</div>';
    }

    function esc(s) {
        return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function hexToRgba(hex, a) {
        hex = String(hex || "#78909C").replace("#", "");
        if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
        var r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
        return "rgba(" + r + "," + g + "," + b + "," + a + ")";
    }

    // ── État : jour sélectionné + jours disponibles ──
    var STATE = { current: null, dates: [] };

    // Événements diffusables (chaîne dispo + non exclus), à partir d'aujourd'hui.
    function diffusableEvents() {
        var todayStr = ymd(new Date());
        return (DATA.evenements || []).slice()
            .filter(function(ev) {
                if (ev.date < todayStr) return false;         // jours passés masqués
                if (ev.diffusable === false) return false;    // exclu manuellement
                return isAvailable(ev.chaine);                // chaîne hors abonnement masquée
            })
            .sort(function(a, b) { return eventStart(a) - eventStart(b); });
    }

    function uniqueDates(evts) {
        var seen = {}, out = [];
        evts.forEach(function(ev) { if (!seen[ev.date]) { seen[ev.date] = 1; out.push(ev.date); } });
        return out;
    }

    function dayTabLabel(dateStr) {
        var p = dateStr.split("-");
        var d = new Date(+p[0], +p[1]-1, +p[2]);
        return JS_DAYS_SHORT[d.getDay()] + " " + pad(d.getDate());
    }

    function renderDayTabs() {
        var el = document.getElementById("day-tabs");
        el.innerHTML = "";
        STATE.dates.forEach(function(dateStr) {
            var btn = document.createElement("div");
            btn.className = "day-tab" + (dateStr === STATE.current ? " active" : "");
            btn.textContent = dayTabLabel(dateStr);
            btn.onclick = function() { STATE.current = dateStr; renderDayTabs(); renderDay(); };
            el.appendChild(btn);
        });
        var active = el.querySelector(".day-tab.active");
        if (active) active.scrollIntoView({ inline: "center", block: "nearest" });
    }

    function renderDay() {
        var now = new Date();
        var schedule = document.getElementById("schedule");
        var todayStr = ymd(now);
        var evts = diffusableEvents().filter(function(ev) { return ev.date === STATE.current; });

        var p = STATE.current.split("-");
        var d = new Date(+p[0], +p[1]-1, +p[2]);
        var isToday = (STATE.current === todayStr);
        var headHtml = '<div class="day-head' + (isToday ? " today" : "") + '">' +
            '<span class="day-name">' + JS_DAYS[d.getDay()] + '</span>' +
            '<span class="day-date">' + d.getDate() + ' ' + JS_MONTHS[d.getMonth()] + '</span>' +
            (isToday ? '<span class="today-tag">Aujourd\'hui</span>' : '') +
            '</div>';

        if (!evts.length) {
            schedule.innerHTML = headHtml + '<div class="empty-state"><div class="big">📺</div>' +
                '<p>Aucune diffusion ce jour.</p></div>';
            return;
        }

        // ── Plage horaire de la journée (début = 1re diffusion, fin = +durée) ──
        var minH = 24, maxH = 0;
        evts.forEach(function(ev) {
            var s = eventStart(ev);
            var sh = s.getHours() + s.getMinutes()/60;
            var eh = sh + eventDuration(ev)/60;
            if (sh < minH) minH = sh;
            if (eh > maxH) maxH = eh;
        });
        minH = Math.floor(minH); maxH = Math.ceil(maxH);
        if (maxH <= minH) maxH = minH + 1;
        var range = maxH - minH;

        var isDesktop = window.innerWidth >= 900;
        var pxPerHour = isDesktop ? 92 : 50;
        var nameW = isDesktop ? 168 : 104;
        var innerMin = nameW + range * pxPerHour;

        // ── Curseur d'heure en direct (uniquement le jour même, dans la plage) ──
        var currentH = now.getHours() + now.getMinutes()/60;
        var showNow = isToday && currentH >= minH && currentH <= maxH;
        var nowPct = ((currentH - minH) / range) * 100;
        var nowHtml = showNow ? '<div class="tl-now" style="left:' + nowPct + '%"></div>' : '';

        // Lignes de grille (heures + demi-heures)
        var gridHtml = "";
        for (var gh = minH; gh <= maxH; gh++) {
            var pos = ((gh - minH) / range) * 100;
            gridHtml += '<div class="tl-gridline hour" style="left:' + pos + '%"></div>';
            if (gh < maxH) {
                var hp = ((gh + 0.5 - minH) / range) * 100;
                gridHtml += '<div class="tl-gridline half" style="left:' + hp + '%"></div>';
            }
        }

        // Marqueurs d'heures
        var markersHtml = "";
        for (var h = minH; h <= maxH; h++) {
            markersHtml += '<span class="tl-marker">' + h + 'h</span>';
        }
        var markersRow = '<div class="tl-row">' +
            '<div class="tl-name tl-chan"><span class="tl-chead">Chaîne</span></div>' +
            '<div class="tl-markers">' + markersHtml + nowHtml + '</div>' +
            '</div>';

        // ── Une ligne par chaîne pertinente ce jour ──
        var byChan = {}, chanOrder = [];
        evts.forEach(function(ev) {
            if (!byChan[ev.chaine]) { byChan[ev.chaine] = []; chanOrder.push(ev.chaine); }
            byChan[ev.chaine].push(ev);
        });
        // Ordonner les chaînes par numéro de chaîne croissant
        // (sans numéro → rejeté en fin de liste, puis ordre alphabétique)
        chanOrder.sort(function(a, b) {
            var na = parseInt(chanNum(a), 10), nb = parseInt(chanNum(b), 10);
            var va = isNaN(na) ? Infinity : na, vb = isNaN(nb) ? Infinity : nb;
            if (va !== vb) return va - vb;
            return a.localeCompare(b);
        });

        var rowsHtml = "";
        chanOrder.forEach(function(chaine) {
            var num = chanNum(chaine);
            var clair = chanClair(chaine);
            var nameCell = '<div class="tl-name tl-chan">' +
                (num ? '<span class="tl-chan-num' + (clair ? " clair" : "") + '">' + esc(num) + '</span>' : '') +
                '<span class="tl-chan-name">' + esc(chaine) + '</span>' +
                '</div>';

            var track = '<div class="tl-track">' + gridHtml + nowHtml;
            byChan[chaine].forEach(function(ev) {
                var s = eventStart(ev);
                var end = new Date(s.getTime() + eventDuration(ev)*60000);
                var sh = s.getHours() + s.getMinutes()/60;
                var eh = sh + eventDuration(ev)/60;
                var left = ((sh - minH) / range) * 100;
                var width = ((eh - sh) / range) * 100;
                if (left < 0) left = 0;
                if (left + width > 100) width = 100 - left;

                var state = (now >= s && now < end) ? "live" : (now >= end ? "done" : "soon");
                var cat = catInfo(ev.categorie);
                var barCls = "tl-bar" + (state === "live" ? " live" : "") + (state === "done" ? " done" : "");
                var barStyle = 'left:' + left + '%;width:' + width + '%;' +
                    'background:' + hexToRgba(cat.couleur, 0.26) + ';border-color:' + cat.couleur + ';';
                var barTitle = esc((ev.heure || "") + " · " + (ev.affiche || "") +
                    " — " + (ev.competition || "") + " · " + chaine);
                var liveHtml = (state === "live") ? '<span class="tl-bar-live">Direct</span>' : '';

                track += '<div class="' + barCls + '" style="' + barStyle + '" title="' + barTitle + '">' +
                    liveHtml +
                    '<div class="tl-prog-title">' + esc(ev.affiche || ev.competition || "") + '</div>' +
                    '<div class="tl-prog-sub' + (state === "live" ? " tl-prog-live" : "") + '">' +
                        esc((ev.heure || "") + " · " + (ev.competition || cat.label)) + '</div>' +
                '</div>';
            });
            track += '</div>';

            rowsHtml += '<div class="tl-row">' + nameCell + track + '</div>';
        });

        var inner = '<div class="tl-inner" style="min-width:' + innerMin + 'px">' +
            markersRow + rowsHtml + '</div>';
        schedule.innerHTML = headHtml + '<div class="timeline" id="timeline">' + inner + '</div>';

        // Auto-scroll pour centrer l'heure courante
        if (showNow) {
            var tl = document.getElementById("timeline");
            var innerEl = tl.querySelector(".tl-inner");
            var scrollPct = (currentH - minH) / range;
            var scrollableWidth = innerEl.scrollWidth - nameW;
            var target = nameW + scrollPct * scrollableWidth - tl.clientWidth / 2;
            tl.scrollLeft = Math.max(0, target);
        }
    }

    function rebuild() {
        renderClock();
        renderNowNext();
        var evts = diffusableEvents();
        STATE.dates = uniqueDates(evts);

        if (!STATE.dates.length) {
            document.getElementById("day-tabs").innerHTML = "";
            document.getElementById("schedule").innerHTML =
                '<div class="empty-state"><div class="big">📺</div>' +
                '<p>Aucune diffusion programmée pour le moment.</p></div>';
            return;
        }

        // Conserve le jour choisi s'il existe encore, sinon aujourd'hui, sinon le 1er.
        var todayStr = ymd(new Date());
        if (STATE.dates.indexOf(STATE.current) === -1) {
            STATE.current = (STATE.dates.indexOf(todayStr) !== -1) ? todayStr : STATE.dates[0];
        }
        renderDayTabs();
        renderDay();
    }

    renderLegend();
    rebuild();
    setInterval(rebuild, 60000);           // rafraîchit l'état EN DIRECT + jours chaque minute
    setInterval(function() {               // recharge la page 1×/h (nouveau programme éventuel)
        location.reload();
    }, 3600000);
    </script>
</body>
