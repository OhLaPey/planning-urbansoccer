name: MAJ programme TV (auto XMLTV)

# Récupère chaque jour un guide XMLTV, filtre les diffusions sport des chaînes
# du centre, régénère tv.html, et commite sur main (ce qui déclenche le
# déploiement GitHub Pages via generate.yml).

on:
  schedule:
    - cron: '0 5 * * *'   # ~07:00 Paris (heure d'hiver) / 07:00-08:00 selon saison
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv-programme
  cancel-in-progress: false

env:
  # Source XMLTV (gratuite, non-officielle). Modifiable ici si le flux change.
  XMLTV_SOURCE: "https://raw.githubusercontent.com/crisvale/channels-and-epg/main/epg/france.xml.gz"
  XMLTV_DAYS: "7"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pré-remplir data/tv-programme.json depuis le flux XMLTV
        run: python prefill_tv_from_xmltv.py --source "$XMLTV_SOURCE" --days "$XMLTV_DAYS" --out data/tv-programme.json

      - name: Régénérer tv.html
        run: python generate_tv.py

      - name: Commiter si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tv-programme.json tv.html
          if git diff --cached --quiet; then
            echo "Aucun changement de programme."
          else
            git commit -m "MAJ programme TV (auto XMLTV)"
            # Rebase au cas où main aurait bougé (sync SharePoint), puis push.
            git pull --rebase --autostash origin main || true
            git push
          fi
