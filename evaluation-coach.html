<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche d'Évaluation Coach — PSG Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0C1C3E;
            color: #fff;
            min-height: 100vh;
            padding: 12px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(12,28,62,0.97);
            border-radius: 10px;
            border-top: 4px solid #E30613;
            padding: 24px 20px 32px;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .header .subtitle {
            color: #E30613;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* ── Infos ── */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }
        .info-grid .full { grid-column: 1 / -1; }
        .field-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 4px;
        }
        .field-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 10px 12px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            transition: border-color 0.2s;
        }
        .field-input:focus {
            outline: none;
            border-color: #E30613;
            box-shadow: 0 0 8px rgba(227,6,19,0.2);
        }

        /* ── Section ── */
        .section { margin-bottom: 22px; }
        .section-title {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #E30613;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(227,6,19,0.2);
        }

        /* ── Critère ── */
        .critere {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 8px;
        }
        .critere-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .critere-name {
            font-size: 13px;
            font-weight: 700;
            color: #e0e0e0;
        }
        .critere-desc {
            font-size: 10px;
            color: #666;
            font-weight: 500;
            margin-bottom: 10px;
        }

        /* ── Rating ── */
        .rating { display: flex; gap: 4px; }
        .rating-btn {
            width: 36px;
            height: 32px;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 5px;
            background: rgba(255,255,255,0.04);
            color: #666;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
        }
        .rating-btn:hover {
            border-color: rgba(227,6,19,0.4);
            color: #E30613;
        }
        .rating-btn.active {
            background: #E30613;
            border-color: #E30613;
            color: #fff;
            box-shadow: 0 0 10px rgba(227,6,19,0.3);
        }
        .rating-btn.nn {
            font-size: 9px;
            letter-spacing: 0.5px;
            color: #555;
        }
        .rating-btn.nn.active {
            background: #444;
            border-color: #555;
            color: #ccc;
            box-shadow: none;
        }

        /* ── Commentaire par critère ── */
        .critere-comment { margin-top: 8px; }
        .critere-comment input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 4px;
            padding: 6px 10px;
            color: #ccc;
            font-family: inherit;
            font-size: 11px;
            font-weight: 400;
        }
        .critere-comment input:focus {
            outline: none;
            border-color: rgba(227,6,19,0.3);
        }
        .critere-comment input::placeholder { color: #444; }

        /* ── Bilan ── */
        .bilan-block { margin-bottom: 14px; }
        .bilan-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bilan-label.positif { color: #4CAF50; }
        .bilan-label.amelioration { color: #FF9800; }
        .bilan-label.general { color: #aaa; }
        .bilan-textarea {
            width: 100%;
            min-height: 80px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 10px 12px;
            color: #ddd;
            font-family: inherit;
            font-size: 12px;
            font-weight: 400;
            resize: vertical;
            line-height: 1.5;
        }
        .bilan-textarea:focus {
            outline: none;
            border-color: rgba(227,6,19,0.3);
            box-shadow: 0 0 8px rgba(227,6,19,0.1);
        }
        .bilan-textarea::placeholder { color: #444; }

        /* ── Boutons ── */
        .actions { display: flex; gap: 10px; margin-top: 24px; }
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #E30613;
            color: #fff;
            box-shadow: 0 0 12px rgba(227,6,19,0.3);
        }
        .btn-primary:hover {
            background: #c00510;
            box-shadow: 0 0 20px rgba(227,6,19,0.4);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #aaa;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover { color: #fff; border-color: rgba(255,255,255,0.2); }
        .btn-danger {
            background: rgba(244,67,54,0.15);
            color: #f44336;
            border: 1px solid rgba(244,67,54,0.2);
        }
        .btn-danger:hover { background: rgba(244,67,54,0.25); }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ── Historique ── */
        .historique-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .historique-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 6px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .historique-item:hover {
            background: rgba(227,6,19,0.08);
            border-color: rgba(227,6,19,0.2);
        }
        .historique-info { flex: 1; }
        .historique-arbitre { font-size: 13px; font-weight: 700; color: #e0e0e0; }
        .historique-date { font-size: 10px; color: #666; font-weight: 500; }
        .historique-delete {
            margin-left: 10px;
            background: none;
            border: none;
            color: #555;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .historique-delete:hover { color: #f44336; background: rgba(244,67,54,0.1); }
        .empty-state {
            text-align: center;
            padding: 24px;
            color: #444;
            font-size: 12px;
            font-weight: 500;
        }

        /* ── Print ── */
        @media print {
            @page { size: A4 portrait; margin: 8mm 10mm; }
            body { background: #fff; color: #000; padding: 0; font-size: 8px; }
            .container { border: none; padding: 0; background: #fff; max-width: 100%; border-top: 3px solid #E30613; }
            .header { border-bottom: 1px solid #E30613; margin-bottom: 6px; padding-bottom: 4px; }
            .header h1 { color: #000; font-size: 14px; margin-bottom: 0; }
            .header .subtitle { font-size: 8px; letter-spacing: 2px; color: #E30613; }
            .section { margin-bottom: 6px; }
            .section-title { font-size: 8px; margin-bottom: 4px; color: #E30613; }
            .section-title::after { background: #E30613; }
            .info-grid { gap: 4px; margin-bottom: 8px; }
            .field-label { font-size: 7px; margin-bottom: 1px; }
            .field-input { border: 1px solid #ccc; color: #000; background: #fff; padding: 3px 6px; font-size: 9px; border-radius: 3px; }
            .critere { padding: 4px 8px; margin-bottom: 3px; border: 1px solid #ddd; background: #fafafa; border-radius: 4px; }
            .critere-header { margin-bottom: 2px; }
            .critere-name { color: #000; font-size: 9px; }
            .critere-desc { color: #666; font-size: 7px; margin-bottom: 2px; }
            .critere-comment { margin-top: 2px; }
            .critere-comment input { padding: 2px 4px; font-size: 8px; border: 1px solid #ccc; color: #000; background: #fff; }
            .rating { gap: 2px; }
            .rating-btn { width: 22px; height: 18px; font-size: 8px; border: 1px solid #ccc; color: #999; background: #fff; border-radius: 3px; }
            .rating-btn.active { background: #E30613; color: #fff; border-color: #E30613; }
            .rating-btn.nn { font-size: 6px; }
            .rating-btn.nn.active { background: #ccc; color: #333; }
            .bilan-block { margin-bottom: 4px; }
            .bilan-label { font-size: 7px; margin-bottom: 2px; }
            .bilan-textarea { border: 1px solid #ccc; color: #000; background: #fff; min-height: 28px; padding: 3px 6px; font-size: 8px; border-radius: 3px; }
            .actions, .historique-section, .toast { display: none !important; }
            p[style] { font-size: 7px !important; margin-bottom: 3px !important; }
            div[style*="margin-bottom:16px"] { margin-bottom: 4px !important; }
            div[style*="font-size:11px"] { font-size: 8px !important; margin-bottom: 3px !important; }
        }

        /* ── Mobile ── */
        @media (max-width: 500px) {
            .container { padding: 16px 14px 24px; }
            .header h1 { font-size: 18px; }
            .info-grid { grid-template-columns: 1fr; }
            .rating-btn { width: 32px; height: 28px; font-size: 12px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Évaluation Coach</h1>
        <div class="subtitle">PSG Academy</div>
    </div>

    <div class="section">
        <div class="section-title">Informations</div>
        <div class="info-grid">
            <div>
                <label class="field-label">Coach</label>
                <input type="text" class="field-input" id="coach" placeholder="Nom du coach">
            </div>
            <div>
                <label class="field-label">Date</label>
                <input type="date" class="field-input" id="date">
            </div>
            <div>
                <label class="field-label">Créneau</label>
                <input type="text" class="field-input" id="creneau" placeholder="Ex : Mercredi 14h00">
            </div>
            <div>
                <label class="field-label">Catégorie</label>
                <input type="text" class="field-input" id="categorie" placeholder="Ex : U8, U10, U12…">
            </div>
            <div class="full">
                <label class="field-label">Observateur</label>
                <input type="text" class="field-input" id="observateur" placeholder="Votre nom">
            </div>
        </div>
    </div>

    <div class="section" id="criteres-section">
        <div class="section-title">Évaluation</div>
    </div>

    <!-- Bilan -->
    <div class="section">
        <div class="section-title">Bilan</div>
        <div class="bilan-block">
            <div class="bilan-label positif">&#9679; Points positifs</div>
            <textarea class="bilan-textarea" id="positifs" placeholder="Ce que le coach a bien fait durant la séance..."></textarea>
        </div>
        <div class="bilan-block">
            <div class="bilan-label amelioration">&#9679; Axes d'amélioration</div>
            <textarea class="bilan-textarea" id="ameliorations" placeholder="Ce sur quoi le coach peut progresser..."></textarea>
        </div>
        <div class="bilan-block">
            <div class="bilan-label general">&#9679; Commentaire général</div>
            <textarea class="bilan-textarea" id="commentaire" placeholder="Remarques complémentaires, contexte particulier..."></textarea>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-primary" onclick="sauvegarder()">Sauvegarder</button>
        <button class="btn btn-secondary" onclick="imprimerFiche()">Imprimer</button>
        <button class="btn btn-danger" onclick="reinitialiser()">Effacer</button>
    </div>

    <div class="section historique-section" style="margin-top: 32px;">
        <div class="historique-header">
            <div class="section-title" style="margin-bottom: 0;">Évaluations sauvegardées</div>
        </div>
        <div id="historique-list">
            <div class="empty-state">Aucune évaluation sauvegardée</div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
var CRITERES = [
    {
        categorie: "Préparation & Organisation",
        items: [
            { id: "prep_seance", nom: "Préparation de la séance", desc: "Séance planifiée, structurée, avec un fil conducteur clair" },
            { id: "prep_materiel", nom: "Matériel & Terrain", desc: "Terrain prêt à l'arrivée des enfants, matériel installé et adapté" },
            { id: "prep_timing", nom: "Gestion du temps", desc: "Début et fin à l'heure, temps de jeu optimisé, transitions fluides" }
        ]
    },
    {
        categorie: "Pédagogie & Contenu",
        items: [
            { id: "peda_consignes", nom: "Clarté des consignes", desc: "Explications claires, adaptées à l'âge, démonstrations si nécessaire" },
            { id: "peda_progression", nom: "Progression des exercices", desc: "Enchaînement logique, difficulté progressive, objectif de la séance atteint" },
            { id: "peda_adaptation", nom: "Adaptation au niveau", desc: "Ajuste les exercices selon le niveau et le nombre d'enfants présents" },
            { id: "peda_jeu", nom: "Place du jeu", desc: "Temps de jeu suffisant, situations ludiques, les enfants s'amusent" }
        ]
    },
    {
        categorie: "Communication & Relation",
        items: [
            { id: "comm_enfants", nom: "Communication avec les enfants", desc: "Ton adapté, encourage, utilise les prénoms, feedback positif" },
            { id: "comm_parents", nom: "Relation avec les parents", desc: "Accueil, échange en début/fin de séance, disponibilité" },
            { id: "comm_energie", nom: "Énergie & Enthousiasme", desc: "Dynamique, motivant, transmet sa passion" }
        ]
    },
    {
        categorie: "Gestion du groupe",
        items: [
            { id: "groupe_attention", nom: "Captation de l'attention", desc: "Les enfants écoutent et sont engagés dans l'exercice" },
            { id: "groupe_discipline", nom: "Discipline & Cadre", desc: "Règles claires, gère les comportements sans crier" },
            { id: "groupe_inclusion", nom: "Inclusion de tous", desc: "Chaque enfant participe, pas de laissés-pour-compte, gestion des niveaux" }
        ]
    },
    {
        categorie: "Sécurité & Attitude",
        items: [
            { id: "secu_vigilance", nom: "Vigilance & Sécurité", desc: "Attentif aux risques, surveille tous les enfants, réagit vite si besoin" },
            { id: "secu_presentation", nom: "Présentation", desc: "Tenue PSG Academy correcte, ponctualité, attitude professionnelle" },
            { id: "secu_exemplaire", nom: "Comportement exemplaire", desc: "Langage adapté, fair-play, montre l'exemple aux enfants" }
        ]
    }
];

function renderCriteres() {
    var container = document.getElementById('criteres-section');
    var html = '<div class="section-title">Évaluation</div>';
    CRITERES.forEach(function(cat) {
        html += '<div style="margin-bottom:16px;">';
        html += '<div style="font-size:11px;font-weight:800;color:#ccc;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;padding-left:4px;">' + cat.categorie + '</div>';
        cat.items.forEach(function(item) {
            html += '<div class="critere" data-id="' + item.id + '">';
            html += '  <div class="critere-header">';
            html += '    <span class="critere-name">' + item.nom + '</span>';
            html += '    <div class="rating">';
            html += '      <button class="rating-btn nn" data-critere="' + item.id + '" data-value="0" onclick="noter(\'' + item.id + '\',0)">N/N</button>';
            for (var i = 1; i <= 5; i++) {
                html += '<button class="rating-btn" data-critere="' + item.id + '" data-value="' + i + '" onclick="noter(\'' + item.id + '\',' + i + ')">' + i + '</button>';
            }
            html += '    </div>';
            html += '  </div>';
            html += '  <div class="critere-desc">' + item.desc + '</div>';
            html += '  <div class="critere-comment"><input type="text" placeholder="Commentaire (optionnel)" data-comment="' + item.id + '"></div>';
            html += '</div>';
        });
        html += '</div>';
    });
    container.innerHTML = html;
}

var notes = {};

function noter(id, value) {
    if (notes[id] === value) { delete notes[id]; }
    else { notes[id] = value; }
    var btns = document.querySelectorAll('[data-critere="' + id + '"]');
    btns.forEach(function(btn) {
        btn.classList.toggle('active', parseInt(btn.dataset.value) === notes[id]);
    });
}

function collecterDonnees() {
    var commentaires = {};
    document.querySelectorAll('[data-comment]').forEach(function(input) {
        if (input.value.trim()) commentaires[input.dataset.comment] = input.value.trim();
    });
    return {
        coach: document.getElementById('coach').value.trim(),
        date: document.getElementById('date').value,
        creneau: document.getElementById('creneau').value.trim(),
        categorie: document.getElementById('categorie').value.trim(),
        observateur: document.getElementById('observateur').value.trim(),
        notes: Object.assign({}, notes),
        commentaires: commentaires,
        positifs: document.getElementById('positifs').value.trim(),
        ameliorations: document.getElementById('ameliorations').value.trim(),
        commentaire: document.getElementById('commentaire').value.trim(),
        timestamp: new Date().toISOString()
    };
}

function sauvegarder() {
    var data = collecterDonnees();
    if (!data.coach) { showToast('Veuillez indiquer le nom du coach'); return; }
    var evaluations = JSON.parse(localStorage.getItem('evaluations_coachs') || '[]');
    data.id = Date.now();
    evaluations.unshift(data);
    localStorage.setItem('evaluations_coachs', JSON.stringify(evaluations));
    showToast('Évaluation sauvegardée');
    renderHistorique();
}

function chargerEvaluation(id) {
    var evaluations = JSON.parse(localStorage.getItem('evaluations_coachs') || '[]');
    var data = evaluations.find(function(e) { return e.id === id; });
    if (!data) return;
    document.getElementById('coach').value = data.coach || '';
    document.getElementById('date').value = data.date || '';
    document.getElementById('creneau').value = data.creneau || '';
    document.getElementById('categorie').value = data.categorie || '';
    document.getElementById('observateur').value = data.observateur || '';
    document.getElementById('positifs').value = data.positifs || '';
    document.getElementById('ameliorations').value = data.ameliorations || '';
    document.getElementById('commentaire').value = data.commentaire || '';
    notes = {};
    document.querySelectorAll('.rating-btn').forEach(function(btn) { btn.classList.remove('active'); });
    if (data.notes) {
        Object.keys(data.notes).forEach(function(critId) { noter(critId, data.notes[critId]); });
    }
    document.querySelectorAll('[data-comment]').forEach(function(input) {
        input.value = (data.commentaires && data.commentaires[input.dataset.comment]) || '';
    });
    showToast('Évaluation chargée');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function supprimerEvaluation(id, event) {
    event.stopPropagation();
    if (!confirm('Supprimer cette évaluation ?')) return;
    var evaluations = JSON.parse(localStorage.getItem('evaluations_coachs') || '[]');
    evaluations = evaluations.filter(function(e) { return e.id !== id; });
    localStorage.setItem('evaluations_coachs', JSON.stringify(evaluations));
    showToast('Évaluation supprimée');
    renderHistorique();
}

function renderHistorique() {
    var evaluations = JSON.parse(localStorage.getItem('evaluations_coachs') || '[]');
    var container = document.getElementById('historique-list');
    if (evaluations.length === 0) {
        container.innerHTML = '<div class="empty-state">Aucune évaluation sauvegardée</div>';
        return;
    }
    var html = '';
    evaluations.forEach(function(ev) {
        var dateStr = '';
        if (ev.date) {
            var d = new Date(ev.date + 'T00:00:00');
            dateStr = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        var subtitle = [dateStr, ev.creneau, ev.categorie].filter(Boolean).join(' — ');
        html += '<div class="historique-item" onclick="chargerEvaluation(' + ev.id + ')">';
        html += '  <div class="historique-info">';
        html += '    <div class="historique-arbitre">' + ev.coach + '</div>';
        html += '    <div class="historique-date">' + subtitle + '</div>';
        html += '  </div>';
        html += '  <button class="historique-delete" onclick="supprimerEvaluation(' + ev.id + ', event)" title="Supprimer">&#10005;</button>';
        html += '</div>';
    });
    container.innerHTML = html;
}

function imprimerFiche() { window.print(); }

function reinitialiser() {
    if (!confirm('Effacer tous les champs de la fiche en cours ?')) return;
    document.getElementById('coach').value = '';
    document.getElementById('date').value = '';
    document.getElementById('creneau').value = '';
    document.getElementById('categorie').value = '';
    document.getElementById('observateur').value = '';
    document.getElementById('positifs').value = '';
    document.getElementById('ameliorations').value = '';
    document.getElementById('commentaire').value = '';
    notes = {};
    document.querySelectorAll('.rating-btn').forEach(function(btn) { btn.classList.remove('active'); });
    document.querySelectorAll('[data-comment]').forEach(function(input) { input.value = ''; });
    showToast('Fiche réinitialisée');
}

function showToast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(function() { el.classList.remove('show'); }, 2500);
}

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    renderCriteres();
    renderHistorique();
});
</script>

</body>
