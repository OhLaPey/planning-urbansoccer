<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Anniversaires{% endblock %} — UrbanSoccer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #1A1A1A;
            min-height: 100vh;
            padding: 15px;
            color: #fff;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: url('bg-team.jpg') center center / cover no-repeat;
            opacity: 0.22;
        }
        .container {
            position: relative; z-index: 1; max-width: 600px; margin: 0 auto;
            background: rgba(26,26,26,0.95); border-radius: 8px;
            padding: 2px 6px; margin-top: 6px; margin-bottom: 6px;
            border-top: 4px solid #FF6600; overflow: hidden;
        }
        .container::after {
            content: '\276F\276F\276F\276F'; position: absolute;
            top: 12px; right: -2px; font-size: 28px; font-weight: 900;
            color: rgba(255,102,0,0.08); letter-spacing: -4px;
            pointer-events: none; z-index: 0;
        }

        /* ── Header ── */
        .header { text-align: center; margin-bottom: 12px; padding: 14px 10px 8px; }
        h1 { color: #fff; font-size: 20px; font-weight: 900; margin-bottom: 2px;
              text-transform: uppercase; letter-spacing: 2px;
              text-shadow: 0 0 30px rgba(255,102,0,0.3); }
        .subtitle { color: #FF6600; font-size: 11px; font-weight: 700; text-transform: uppercase;
                     letter-spacing: 3px; }

        /* ── Flash messages ── */
        .flash { padding: 10px 16px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; font-weight: 600; }
        .flash.success { background: rgba(100,220,60,0.1); border: 1px solid rgba(100,220,60,0.3); color: #64dc3c; }
        .flash.error { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3); color: #ff5050; }

        /* ── Cards ── */
        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px;
        }
        .card-title {
            color: #FF6600; font-size: 12px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border: none; border-radius: 6px;
            font-size: 12px; font-weight: 700; cursor: pointer;
            text-decoration: none; transition: all 0.2s; font-family: inherit;
            text-transform: uppercase; letter-spacing: 0.3px;
        }
        .btn-primary {
            background: #FF6600; color: white;
            box-shadow: 0 0 15px rgba(255,102,0,0.3);
        }
        .btn-primary:hover { background: #ff9050; box-shadow: 0 0 20px rgba(255,102,0,0.5); }
        .btn-secondary {
            background: rgba(255,255,255,0.04); color: #888;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .btn-secondary:hover { background: rgba(255,102,0,0.1); color: #FF6600;
                                border-color: rgba(255,102,0,0.3); }
        .btn-danger {
            background: rgba(255,80,80,0.1); color: #ff5050;
            border: 1px solid rgba(255,80,80,0.2);
        }
        .btn-danger:hover { background: rgba(255,80,80,0.2); }
        .btn-sm { padding: 5px 10px; font-size: 10px; }

        /* ── Forms ── */
        .form-group { margin-bottom: 12px; }
        .form-label {
            display: block; font-size: 10px; font-weight: 700;
            color: #888; text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .form-input, .form-select {
            width: 100%; padding: 10px 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; color: #fff;
            font-size: 13px; font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-select:focus {
            outline: none; border-color: rgba(255,102,0,0.4);
            box-shadow: 0 0 10px rgba(255,102,0,0.15);
        }
        .form-input::placeholder { color: #444; }
        .form-select option { background: #1f1f1f; color: #ccc; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        textarea.form-input { resize: vertical; min-height: 60px; }

        /* ── Date selector ── */
        .date-nav {
            display: flex; justify-content: center; align-items: center;
            gap: 6px; margin-bottom: 15px; flex-wrap: wrap;
        }
        .date-chip {
            padding: 6px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            color: #666; text-decoration: none;
            font-weight: 600; font-size: 11px;
            transition: all 0.2s; text-transform: uppercase;
        }
        .date-chip:hover { background: rgba(255,102,0,0.1); border-color: rgba(255,102,0,0.3); color: #FF6600; }
        .date-chip.active {
            background: rgba(255,102,0,0.15); border-color: rgba(255,102,0,0.3); color: #FF6600;
        }

        /* ── Stats badges ── */
        .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; justify-content: center; }
        .stat-badge {
            padding: 4px 12px; border-radius: 4px; font-size: 10px; font-weight: 700;
            text-transform: uppercase;
        }
        .stat-total { background: rgba(255,102,0,0.15); color: #FF6600; border: 1px solid rgba(255,102,0,0.3); }
        .stat-ligue1 { background: rgba(255,165,0,0.12); color: #FFA500; }
        .stat-cl { background: rgba(100,149,237,0.15); color: #6495ED; }
        .stat-fff { background: rgba(76,175,80,0.15); color: #66BB6A; }
        .stat-bump { background: rgba(186,85,211,0.15); color: #BA55D3; }

        /* ── Birthday table ── */
        .birthday-list { width: 100%; }
        .birthday-row {
            display: grid;
            grid-template-columns: 60px 1fr 130px 60px auto;
            align-items: center; gap: 8px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s;
        }
        .birthday-row:hover { background: rgba(255,255,255,0.03); }
        .birthday-row:last-child { border-bottom: none; }
        .birthday-time { color: #888; font-size: 13px; font-family: 'Space Mono', monospace; }
        .birthday-name { font-weight: 700; font-size: 15px; display: block; }
        a.birthday-name:hover { color: #FF7832 !important; }
        .birthday-details { color: #666; font-size: 11px; }
        .birthday-formule {
            font-size: 10px; font-weight: 700; padding: 3px 10px;
            border-radius: 4px; text-align: center; white-space: nowrap;
            text-transform: uppercase;
        }
        .formule-ligue1 { background: rgba(255,165,0,0.12); color: #FFA500; }
        .formule-cl { background: rgba(100,149,237,0.15); color: #6495ED; }
        .formule-fff { background: rgba(76,175,80,0.15); color: #66BB6A; }
        .formule-bump { background: rgba(186,85,211,0.15); color: #BA55D3; }
        .birthday-kids { color: #888; font-size: 12px; text-align: center; }
        .birthday-actions { display: flex; gap: 4px; justify-content: flex-end; }

        /* ── Download bar ── */
        .download-bar {
            display: flex; gap: 8px; justify-content: center;
            flex-wrap: wrap; margin-top: 12px; padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        /* ── Empty state ── */
        .empty-state { text-align: center; padding: 40px 20px; color: #555; }
        .empty-state p { margin-bottom: 16px; font-size: 13px; }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .birthday-row { grid-template-columns: 50px 1fr auto; }
            .birthday-formule, .birthday-kids { display: none; }
            .form-row, .form-row-3 { grid-template-columns: 1fr; }
        }

        /* ── Confirm dialog ── */
        .confirm-overlay {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.85); align-items: center; justify-content: center;
        }
        .confirm-overlay.active { display: flex; }
        .confirm-box {
            background: #1f1f1f; border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; padding: 24px; max-width: 360px; text-align: center;
        }
        .confirm-box p { margin-bottom: 16px; font-size: 13px; }
        .confirm-box .btn { margin: 0 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Anniversaires</h1>
            <div class="subtitle">Urban 7D</div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
